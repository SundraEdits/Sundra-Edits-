name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          test -f SundraEditsApp.zip || { echo "SundraEditsApp.zip repo के root में नहीं मिली"; exit 1; }
          unzip -q SundraEditsApp.zip
          ls SundraEditsApp

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          build-root-directory: SundraEditsApp

      - name: Build debug APK
        working-directory: SundraEditsApp
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SundraEdits-debug-apk
          path: SundraEditsApp/app/build/outputs/apk/debug/*.apk
